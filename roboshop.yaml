- name: create ec2 instance and r53 records
  hosts: local
  connection: local

  vars:
    # ansible-playbook roboshop.yaml -e '{"instances":["mongodb"]}'
    # ansible-playbook roboshop.yaml -e actions="delete" -e '{"instances":["mongodb"]}'

    instances:
      [
        "mongodb",
        "redis",
        "mysql",
        "rabbitmq",
        "catalogue",
        "user",
        "cart",
        "shipping",
        "payment",
        "dispatch",
        "frontend",
      ]
      # instances: ["catalogue", "user", "cart", "shipping", "payment", "dispatch"]
    actions: create
    domain_name: dewsecopai.online
    ami_id: ami-0055977a6e828a4f4

  tasks:
    - name: create ec2 instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        region: us-east-1
      loop: "{{ instances }}"
      when: actions == "create"
      register: ec2_output

    # - name: Print ec2 creation output
    #   debug:
    #     msg: "{{ ec2_output }}"

    - name: delete ec2 instances
      amazon.aws.ec2_instance:
        state: absent
        name: "roboshop-{{ item }}"
        region: us-east-1
        wait: false
      loop: "{{ instances }}"
      when: actions == "delete"
