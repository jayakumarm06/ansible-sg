  tasks:
    - name: create security group
      amazon.aws.ec2_security_group:
        name: "{{ item.key }}-ansible-sg"
        description: "{{ item.key }} security group"
        vpc_id: "{{ vpc_id }}"
        region: us-east-1
        rules:
          - proto: tcp
            from_port: "{{ item.value.port }}"
            to_port: "{{ item.value.port }}"
            cidr_ip: "{{ my_ip }}"
            rule_desc: Allow mongodb access

          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ my_ip }}"
            rule_desc: Allow SSH from IP
      loop: "{{ security_groups | dict2items }}" #ansible filter converts a dict into list so loop can iterate
      when: actions == "create"
      register: sg

    - name: print msg
      debug:
        msg: "  {{ item.group_id }} "
      loop: "{{ sg_results.results }}"

