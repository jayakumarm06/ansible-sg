- name: create ec2 instance and r53 records
  hosts: local
  connection: local

  vars:
    actions: create
    # domain_name: dewsecopai.online
    # ami_id: ami-0055977a6e828a4f4
    vpc_id: vpc-0b7a72268d3c1a098

  tasks:
    - name: creat security group
      amazon.aws.ec2_security_group:
        name: mongo-ansible-sg
        description: mongo-ansible-sg security group
        vpc_id: "{{ vpc_id }}"
        region: us-east-1
        rules:
          - proto: tcp
            from_port: 27017
            to_port: 27017
            cidr_ip: "{{ my_ip }}"
            rule_desc: Allow mongodb access

          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ my_ip }}"
            rule_desc: Allow SSH from IP
        state: present
      register: sg

    - name: print msg
      debug:
        msg:
          "  {{ sg.group_name }}: {{ sg.group_id }} "

          # - proto: tcp
          #   from_port: 3306
          #   to_port: 3306
          #   group_id: sg-0abc1234567ffffff
